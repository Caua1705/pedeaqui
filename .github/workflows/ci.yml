name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O lockfile deste repo e aceito por qualquer npm (10.x ate 11.12.x), entao
      # o CI nao depende desta versao para instalar. Ela existe so para o runner
      # nao cair no npm 11.6.2 caso o Node passe a embutir justamente ele: aquela
      # versao tem uma regressao no lockfile e engines.npm (>=11.7.0) a barra, o
      # que faria o install falhar com EBADENGINE. Espelha o npm da Vercel, para
      # os dois ambientes de build serem iguais. Ver .npmrc.
      # --engine-strict=false so aqui: o alvo e o npm global, nao este projeto.
      - name: Pin npm (mirrors Vercel's npm)
        run: |
          echo "runner trouxe npm $(npm -v)"
          npm i -g npm@11.12.1 --engine-strict=false
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The E2E mocks every API call (tests/e2e/helpers.js), so CI never reaches
      # the production API. VITE_API_BASE_URL/VITE_MAPS_KEY are unset here on
      # purpose — app-config falls back to a default base and no request escapes
      # the page anyway.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
