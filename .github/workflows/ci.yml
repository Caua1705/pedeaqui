name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O lockfile deste repo e aceito por qualquer npm (10.x ate 11.12.x), entao
      # o CI nao depende desta versao para instalar. Ela existe so para o runner
      # nao cair no npm 11.6.2 caso o Node passe a embutir justamente ele: aquela
      # versao tem uma regressao no lockfile e engines.npm (>=11.7.0) a barra, o
      # que faria o install falhar com EBADENGINE. Espelha o npm da Vercel, para
      # os dois ambientes de build serem iguais. Ver .npmrc.
      # --engine-strict=false so aqui: o alvo e o npm global, nao este projeto.
      - name: Pin npm (mirrors Vercel's npm)
        run: |
          echo "runner trouxe npm $(npm -v)"
          npm i -g npm@11.12.1 --engine-strict=false
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-check do caminho do CARTAO (payment-card-flow, mercado-pago-service,
      # customer-card-service, payment-config-service) contra scripts/types/api.d.ts.
      # Ficou fora do CI desde que foi criado: existia so como script que alguem
      # tinha de lembrar de rodar, justamente no caminho que cobra dinheiro. E o
      # unico lugar que pega um campo de API renomeado antes do runtime.
      - name: Typecheck (cartao)
        run: npm run typecheck:cards

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # A E2E mocka a nossa API inteira (tests/e2e/helpers.js), entao o CI nunca
      # cria pedido de verdade. VITE_API_BASE_URL/VITE_MAPS_KEY ficam sem valor
      # de proposito: app-config cai numa base padrao e nenhuma chamada nossa
      # escapa da pagina.
      #
      # "Nenhuma requisicao escapa" NAO vale para o SDK do Mercado Pago:
      # payment-card-loading-state.spec.js baixa sdk.mercadopago.com DE VERDADE,
      # de proposito — com o SDK mockado antes do boot, loadSdk() nunca chega a
      # baixar nada e o atraso e a falha do download passavam batidos. Com
      # PAYMENT_PUBLIC_KEY configurado, mercado-pago-secure-fields.spec.js
      # tambem fala com o Mercado Pago.
      #
      # "OS UNICOS HOSTS EXTERNOS DA SUITE" ESTAVA ERRADO, e a frase custou o
      # plano. O terceiro era o Supabase Storage: as fixtures apontam para o
      # bucket de PRODUCAO e `mockApi()` so interceptava `api.pederapidex.com`,
      # entao cada um dos ~433 testes baixava ~7 imagens de verdade, com o cache
      # vazio de um contexto novo. Vezes um push por vez que alguem toca a main.
      # Egress medido: 14,19 GB contra 5 GB do plano, com ZERO usuarios.
      #
      # Desde 05/09/2026 `mockApi()` dubla o Storage com um pixel de 1x1.
      # `image-framing.spec.js` pede as imagens REAIS de proposito
      # (`imagensReais: true`) — ele compara a proporcao da derivada com a do
      # original, e com o dublê passaria verde sem medir nada.
      # PAYMENT_PUBLIC_KEY liga os 3 testes de mercado-pago-secure-fields.spec.js
      # que rodam o SDK REAL sob a CSP REAL de producao. Sem ela eles se PULAM em
      # silencio — e sao exatamente os que pegam bloqueio de connect-src, a classe
      # de bug do commit 63ffa5a. Uma chave PUBLICA de teste do Mercado Pago;
      # esta como secret por higiene, nao por sigilo. Sem o secret configurado no
      # repositorio os 3 continuam pulando, como hoje.
      - name: E2E tests
        run: npm run test:e2e
        env:
          PAYMENT_PUBLIC_KEY: ${{ secrets.PAYMENT_PUBLIC_KEY }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  #  O DEPLOY DE PRODUCAO SAI DAQUI, E SO DAQUI.
  #
  #  Ate 31/08/2026 a integracao Git da Vercel publicava a main no INSTANTE do
  #  push. O job `verify` acima roda `on: push: branches: [main]` — ele confere,
  #  ele nao publica, e a Vercel nao esperava por ele. O site subia e o portao
  #  ficava vermelho depois. Isso quase custou caro na rodada anterior: o portao
  #  pre-merge reportou `exit 0` com dois testes vermelhos por causa de um
  #  `| tail`, e se o merge tivesse saido ali o deploy teria ido junto.
  #
  #  A trava tem DUAS metades, e meia trava e pior que nenhuma porque parece uma:
  #    1. `vercel.json` traz `git.deploymentEnabled.main = false`.
  #    2. este job publica, com `needs: verify`.
  #  `tests/unit/deploy-gate.test.js` falha se qualquer uma das duas sumir.
  #
  #  Por que este caminho e nao os outros dois que foram avaliados:
  #  - `ignoreCommand` no vercel.json consultando a Checks API e uma CORRIDA — a
  #    Vercel comeca o build no instante do push, veria `pending` e pularia o
  #    deploy, e um CI que fica verde depois NAO dispara deploy nenhum.
  #  - protecao de branch exigindo o check tambem fecha, e pela raiz certa, mas
  #    cobra PR para tudo (o fluxo aqui e merge local + push) e, em repositorio
  #    privado, plano pago.
  #
  #  Os previews de branch CONTINUAM automaticos: `deploymentEnabled` desliga so
  #  a branch nomeada, e preview e o que a migracao do Maps ainda precisa (a
  #  chave do Google nao libera localhost).
  #
  #  O `vercel pull` SAIU deste job em 02/09/2026 (ver o passo "Publicar na
  #  Vercel"): ele falhava com "Could not retrieve Project Settings" mesmo com
  #  os tres secrets certos. Com ele foram embora as variaveis de ambiente de
  #  PRODUCAO do projeto — o passo abaixo diz quais o build le e o que acontece
  #  com cada uma sem o `pull`.
  #
  #  A CLI vai sem pin de versao de proposito: um pin errado quebra o deploy no
  #  dia em que for preciso publicar, e este job so roda depois de quatro
  #  portoes verdes.
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy de producao (Vercel)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Falha BARULHENTA, e nao silenciosa. Sem o segredo, um `if` que apenas
      # pulasse o passo deixaria o job VERDE sem ter publicado — a producao
      # parada no commit anterior, sem uma linha dizendo por que. E exatamente o
      # modo de falha que este job existe para acabar.
      - name: Conferir o segredo do deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          faltando=""
          [ -z "$VERCEL_TOKEN" ] && faltando="$faltando VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && faltando="$faltando VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && faltando="$faltando VERCEL_PROJECT_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Faltam secrets do repositorio:$faltando. Sem eles o deploy nao acontece, e o vercel.json ja desligou o automatico da main — a producao fica no commit anterior."
            exit 1
          fi

      # SEM `vercel pull`, DE PROPOSITO — 02/09/2026.
      #
      # O `pull` falhava com "Could not retrieve Project Settings" com os tres
      # secrets corretos: o CLI 59.x ignora o VERCEL_ORG_ID do ambiente quando o
      # projeto esta num TIME, procura o projeto na conta pessoal do dono do
      # token, e la ele nao existe.
      #
      # Tirar o `pull` NAO BASTOU, e escrever o arquivo com o par de IDs
      # TAMBEM NAO: o `vercel build` continuou parando em "No project settings
      # found locally". O que ele cobra do `.vercel/project.json` nao sao os
      # IDs — e a chave `settings`, e a falta DELA da exatamente a mesma
      # mensagem que a falta do arquivo inteiro. Foi o que custou a segunda
      # tentativa: a mensagem manda rodar o `pull`, e o `pull` nao era o
      # problema.
      #
      # Medido em 02/09/2026 fora deste repositorio, com IDs FALSOS e SEM
      # token: com `settings` o `build --prod` completa, sem ela ele para.
      # Quer dizer que o `build` nao fala com a Vercel — a checagem e local,
      # e por isso o par de IDs sozinho nunca ia passar por ela.
      #
      # A chave aceita ate `{}`: o CLI detecta o resto. Aqui ela nomeia o
      # framework porque `vite` e o que o package.json diz, e porque e ele
      # que decide que a saida publicada e `dist/` e nao a arvore de fontes.
      # As duas formas foram rodadas contra o build DE VERDADE deste
      # repositorio, e as duas publicam o `index.html` que chama
      # `/assets/main-<hash>.js` — nao o `/scripts/entry-landing.js` da fonte.
      # Nenhum outro campo entra aqui: `nodeVersion` ou `buildCommand`
      # inventados calam por cima do painel sem ninguem ver.
      #
      # NAO troque isto por `vercel build --yes`, que a propria CLI sugere na
      # mensagem de erro: o `--yes` pula direto para o `pull`, e o `pull` e
      # justamente o que falha aqui — "Could not retrieve Project Settings",
      # o mesmo erro da primeira tentativa.
      #
      # Com o arquivo no lugar, `build` e `deploy` acham o projeto no time
      # sem `--scope`: o orgId sai do arquivo.
      #
      # O arquivo nao esta e nao pode estar no repositorio — `.vercel` e
      # gitignored e os dois IDs so existem em tempo de execucao. Se um dia o
      # `--scope` voltar a ser preciso, o valor e o SLUG do time
      # (cauas-projects-3c9f6aea), e nao o VERCEL_ORG_ID: passar o ID nesse
      # papel foi justamente o que ja falhou aqui.
      #
      # O QUE O `pull` TRAZIA E AGORA NAO VEM: as variaveis de ambiente de
      # producao do projeto na Vercel. Este build le TRES, todas em tempo de
      # build (o Vite inlina `import.meta.env` no bundle; nao adianta configurar
      # no painel depois):
      #
      #   VITE_API_BASE_URL        fallback em scripts/config/app-config.js e
      #                            'https://api.pederapidex.com' — o MESMO valor
      #                            de producao. Ausente nao muda o bundle.
      #   VITE_TENANT_ROOT_DOMAINS fallback ['rapidex.com','pederapidex.com'],
      #                            tambem igual ao de producao. Idem.
      #   VITE_MAPS_KEY            NAO TEM FALLBACK. scripts/config/maps-config.js
      #                            resolve para '' e o mapa do endereco morre em
      #                            SILENCIO no bundle publicado.
      #   VITE_GOOGLE_CLIENT_ID    NAO TEM FALLBACK, e o vazio e uma DECISAO: sem
      #                            client id o "Entrar com Google" nao aparece
      #                            (app-config.js diz por que). Entrou em
      #                            04/09/2026 com o login social.
      #
      # ERAM TRES ATE 05/09/2026, E ESSA LISTA FICOU PARA TRAS — foi o defeito.
      # A variavel do Google foi cadastrada no painel da Vercel, em Production,
      # Preview e Development, e o botao continuou escondido no deploy seguinte.
      # O motivo esta duas linhas acima: **este build nao roda na Vercel e nao
      # fala com o painel dela**. Ele roda no runner do GitHub, com
      # `vercel build --prod` sobre o checkout, e le exclusivamente o que
      # estiver no `env:` do passo abaixo. Configurar no painel nao chega aqui.
      #
      # A prova, no bundle publicado de 05/09/2026: `VITE_MAPS_KEY` veio
      # PREENCHIDA (ela e secret do repositorio) e `VITE_GOOGLE_CLIENT_ID` veio
      # VAZIA (ela so existia no painel). Mesma build, mesmo arquivo, duas
      # variaveis — a diferenca e so ONDE elas moram.
      #
      # POR ISSO AS QUATRO ESTAO NO `env:` ABAIXO, inclusive as duas que tem
      # fallback identico ao de producao: o passo passa a ser o INVENTARIO das
      # variaveis de build, e a quinta que aparecer nao repete isto.
      # `tests/unit/build-env.test.js` cobra a lista.
      #
      # Nenhum valor e inventado aqui: se o secret nao existir, o passo AVISA e
      # o bundle sobe sem a variavel — o mesmo que ja acontecia com o `pull`
      # quebrado, so que agora escrito no log.
      - name: Publicar na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_MAPS_KEY: ${{ secrets.VITE_MAPS_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TENANT_ROOT_DOMAINS: ${{ secrets.VITE_TENANT_ROOT_DOMAINS }}
        run: |
          if [ -z "$VITE_MAPS_KEY" ]; then
            echo "::warning::Sem o secret VITE_MAPS_KEY: o bundle vai subir com a chave do Google Maps VAZIA e o mapa do endereco nao carrega. Copie o valor de Vercel > Project > Settings > Environment Variables > Production."
          fi
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::Sem o secret VITE_GOOGLE_CLIENT_ID: o bundle sobe com o client id VAZIO e o botao 'Entrar com Google' NAO APARECE. Configurar no painel da Vercel nao resolve — este build roda no runner e le so o env deste passo. Crie o secret no GitHub com o mesmo valor."
          fi
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID","settings":{"framework":"vite"}}
          EOF
          # Este passo nao tem `working-directory`, e o job tambem nao: o
          # heredoc escreve e o `build` le a MESMA pasta, a raiz do checkout.
          # O `pwd` fica para que isso seja um fato no log, e nao uma leitura
          # do yaml. O `cat` nao vaza os IDs: o Actions troca todo valor de
          # secret por `***`. E por isso mesmo ele serve de medida — `***` e
          # secret com valor, `""` e secret VAZIO, que e a outra maneira de
          # este arquivo sair errado sem ninguem ver.
          echo "--- .vercel/project.json entregue ao build, em $(pwd) ---"
          cat .vercel/project.json
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # O DEPLOY SO ESTA FEITO QUANDO O HEADER MUDA — 06/09/2026.
      #
      # Em 05/09 a correcao do `style-src` (o `gsi/style` do botao do Google era
      # recusado em TODA visita) entrou na vercel.json, o unitario passou a
      # exigi-la e o documento escreveu "Corrigido". A producao serviu o header
      # ANTIGO por um dia: o commit nunca foi empurrado, e nenhum teste daqui
      # podia ter visto, porque todos leem o ARQUIVO e o arquivo nao e o que o
      # navegador recebe.
      #
      # Este passo pede o header a producao DEPOIS de publicar e compara com a
      # vercel.json deste commit, diretiva por diretiva. Ele nao pode subir para
      # o `verify`: la ele leria o deploy ANTERIOR, toda mudanca de CSP
      # reprovaria antes de publicar e a correcao nunca chegaria ao ar.
      #
      # O `--esperar` e para o alias do dominio propagar, nao para "tentar de
      # novo ate dar certo": esgotado o prazo, o passo FALHA com o header
      # servido no log.
      - name: Conferir a CSP no header SERVIDO pela producao
        run: node tools/csp-em-producao.mjs --esperar 180
