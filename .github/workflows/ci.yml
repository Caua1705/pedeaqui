name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A forma do lockfile depende da versao EXATA do npm, nao so do major: o
      # npm <=11.3 grava peerDependencies opcionais (@emnapi/*, via
      # @napi-rs/wasm-runtime) como entradas top-level e o 11.6.2 nao, entao cada
      # um recusa o lock do outro com EUSAGE. O npm que vem embutido no Node muda
      # sem aviso, entao nao da para depender dele: fixamos aqui a mesma versao
      # declarada em engines.npm, que e a unica fonte da verdade.
      # --engine-strict=false so neste passo: o alvo e o npm global, nao este
      # projeto, e o npm do runner ainda e o "errado" quando ele roda.
      - name: Pin npm to the version in engines.npm
        run: |
          want=$(node -p "require('./package.json').engines.npm")
          echo "runner trouxe npm $(npm -v); fixando em $want"
          npm i -g "npm@$want" --engine-strict=false
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The E2E mocks every API call (tests/e2e/helpers.js), so CI never reaches
      # the production API. VITE_API_BASE_URL/VITE_MAPS_KEY are unset here on
      # purpose — app-config falls back to a default base and no request escapes
      # the page anyway.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
