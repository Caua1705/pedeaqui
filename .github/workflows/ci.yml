name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 traz npm 11, o mesmo major usado no desenvolvimento. O major do
      # npm precisa bater: o npm 10 materializa peerDependencies opcionais (ex.
      # @emnapi/*, via @napi-rs/wasm-runtime) como entradas top-level do lock e o
      # npm 11 nao, entao cada um recusa o lock gerado pelo outro com EUSAGE.
      # "engines" + engine-strict (.npmrc) travam o outro lado: um npm fora desta
      # faixa falha o install em vez de gravar um lock divergente.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The E2E mocks every API call (tests/e2e/helpers.js), so CI never reaches
      # the production API. VITE_API_BASE_URL/VITE_MAPS_KEY are unset here on
      # purpose — app-config falls back to a default base and no request escapes
      # the page anyway.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
